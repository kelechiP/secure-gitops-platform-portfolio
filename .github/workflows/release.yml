name: Release container

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/kelechip/secure-gitops-platform-portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          release_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${release_commit}" refs/remotes/origin/main; then
            echo "Release tag commit must be reachable from origin/main" >&2
            exit 1
          fi

      - name: Refuse an existing or uncertain version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_release_tag.py

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}

      - name: Scan before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate SPDX SBOM before publication
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:${{ github.ref_name }}
          format: spdx-json
          output-file: platform-api.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image and capture digest
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          reference="$(docker inspect --format='{{ index .RepoDigests 0 }}' "${IMAGE}:${GITHUB_REF_NAME}")"
          digest="${reference#*@}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve the published image digest" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest SPDX SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: platform-api.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest with GitHub OIDC
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          "${IMAGE}@${DIGEST}"

      - name: Upload SBOM and attestation bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.ref_name }}
          path: |
            platform-api.spdx.json
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
