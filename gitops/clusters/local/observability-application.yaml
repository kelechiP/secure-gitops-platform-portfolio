apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-api-observability-local
  namespace: argocd
spec:
  project: observability-local
  source:
    repoURL: https://github.com/kelechiP/secure-gitops-platform-portfolio.git
    targetRevision: main
    path: helm/platform-api
    helm:
      releaseName: platform-api-observability
      values: |
        monitoring:
          enabled: true
          resourcesOnly: true
  destination:
    server: https://kubernetes.default.svc
    namespace: secure-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
