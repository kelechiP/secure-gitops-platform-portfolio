replicaCount: 2

image:
  repository: ghcr.io/kelechip/secure-gitops-platform-portfolio
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

monitoring:
  enabled: false
  resourcesOnly: false
  interval: 30s
  labels:
    observability.secure-platform/enabled: "true"

environment: local
