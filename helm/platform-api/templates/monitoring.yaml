{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "platform-api.name" . }}
  labels:
    {{- toYaml .Values.monitoring.labels | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "platform-api.name" . }}
      app.kubernetes.io/instance: platform-api-local
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "platform-api.name" . }}
  labels:
    {{- toYaml .Values.monitoring.labels | nindent 4 }}
spec:
  groups:
    - name: platform-api.rules
      rules:
        - alert: PlatformApiTargetDown
          expr: |
            (up{namespace="secure-platform", service="platform-api"} == 0)
            or
            absent(up{namespace="secure-platform", service="platform-api"})
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Platform API metrics target is unavailable
            description: Prometheus has been unable to scrape the Platform API target in secure-platform for at least two minutes. Check the Deployment, Service, Endpoints, and NetworkPolicy.
{{- end }}
